name: CI — agents/coordinator

on:
  push:
    branches: [ agents/coordinator/init-github-app ]
  pull_request:
    branches: [ agents/coordinator/init-github-app ]

jobs:
  test:
    name: Test Coordinator
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      working-directory: agents/coordinator
      run: npm install
      
    - name: Lint
      working-directory: agents/coordinator
      run: npm run lint
      
    - name: TypeScript compilation check
      working-directory: agents/coordinator
      run: npm run build
      
    - name: Run tests
      working-directory: agents/coordinator
      run: npm test

  build:
    name: Build Coordinator
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      working-directory: agents/coordinator
      run: npm install
      
    - name: Build
      working-directory: agents/coordinator
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coordinator-build
        path: agents/coordinator/dist/
